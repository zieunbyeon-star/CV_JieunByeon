experiences:
  title: Experiences
  info:
  - role: Undergraduate Research Student
    time: Mar 2026 - Jun 2026
    company: Computational Materials Design, Konkuk University
    details: |
      Six months of research on AI-driven chemical process optimization.

      - Developed a Bayesian Optimization pipeline (Gaussian Process + Expected Improvement) coupled with DWSIM simulations
      - Tuned GP hyperparameters with Optuna using an offline-replay oracle built from simulation data
      - Validated on heat exchanger, flash tank, and ethanol-water distillation cases
      
  - role: Undergraduate Research Student
    time: Sep 2026 - Feb 2027
