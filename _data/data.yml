projects:
  title: Projects
  intro: >
    Selected projects in process optimization, machine learning, and plant design.
  assignments:
  - title: ChemOpt Studio
    link: "https://jieun-bo.streamlit.app/"
    tagline: "Bayesian Optimization web app for chemical process simulation (GP with ARD, EI acquisition, constraint handling). Reached 1.65% error on a flash tank case and exceeded the grid-search optimum on ethanol distillation."

  - title: Cumene Reactor ML Soft-Sensor (2026 Chemical Process Design Competition, Team Lead)
    link: "#"
    tagline: "Predicts reactor outlet quality from process data; Extra Trees model exported to ONNX and embedded in AVEVA Process Simulation, validated with time-block extrapolation tests."

  - title: UCO Biodiesel Plant Feasibility Study (Capstone)
    link: "#"
    tagline: "50,000 kL/yr FAME plant design with a 20-year DCF model (NPV ≈ KRW 22.5B, IRR 15.5%), sensitivity analysis, and SHE assessment (ATEX, SIL)."

  - title: "DFT: Theory, Applications, and Future (Capstone Report)"
    link: "#"
    tagline: "Wrote the future-of-DFT section covering deep-learning functionals and neural network potentials; edited the full report."


