career-profile:
  title: Career Profile
  summary: |
    Final-year chemical engineering student at Konkuk University who applies
    machine learning and process simulation to chemical process optimization.
    I built ChemOpt Studio, a Bayesian Optimization web app that finds optimal
    operating conditions for DWSIM process simulations, and I am leading a team
    in the 2026 Chemical Process Design Competition, developing an ML
    soft-sensor for a cumene reactor.

    I am interested in process engineering and infrastructure roles where
    data-driven methods can improve yield, efficiency, and safety.


